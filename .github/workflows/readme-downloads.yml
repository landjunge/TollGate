name: Refresh README installer downloads
on:
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '31 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_installer_downloads.py
      - .github/workflows/readme-downloads.yml
permissions:
  contents: write
concurrency:
  group: readme-downloads
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Update both READMEs from published assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          python3 scripts/update_installer_downloads.py
          git add README.md README.de.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: refresh installer download slots [skip ci]"
          git push origin HEAD:main
